<!--
	Basic example of a LogicMonitor Text/Custom HTML widget using the LogicMonitor Widget SDK.
	This widget will display a list of devices in alert status, as well as a summary of the number of devices in alert status and the number of alerts that have not cleared.

	SDK commands this script helps demonstrate:
	- lm.auth.fromTokens()
	- lm.configure()
	- lm.context.onReady()
	- lm.error()
	- lm.getAlerts()
	- lm.info()
	- lm.query()
-->

<!-- Capture optional API tokens containing LogicMonitorAPI credentials or a bearer token. If not specified then the widget will use integrated authentication. -->
<div id="apiBearerTokenToken" style="display:none">##apiBearerToken##</div>
<div id="apiIDToken" style="display:none">##apiID##</div>
<div id="apiKeyToken" style="display:none">##apiKey##</div>

<h3>Devices in alert</h3>
<!-- Containers are not empty because LogicMonitor's editor strips empty elements. The script replaces this text... -->
<div id="deviceList">Loading devices...</div>
<div id="status">&nbsp;</div>

<!-- Load the lm SDK, which exposes a global "lm" object... -->
<script src="https://cdn.jsdelivr.net/gh/logicmonitor/custom_widgets@main/sdk/lm-sdk.js"></script>

<script>
	// Runs after the widget has finished rendering...
	lm.context.onReady(async function () {
		// Set a name for log messages and the minimum log level to write to the console...
		lm.configure({ widgetName: "Device List Example", logLevel: "info" });

		// Uses the credentials above when supplied; otherwise falls back to the integrated portal session...
		lm.info("Auth mode: " + lm.auth.fromTokens());

		// Get the elements we will fill in...
		var container = document.getElementById("deviceList");
		var status = document.getElementById("status");

		try {
			// Build a devices API query: only devices whose alert status is not "none", returning just three fields, sorted by name, max 200...
			// getItems() pages through the API as needed and returns a flat array of devices...
			var devices = await lm.query("devices")
				.addQuery("alertStatus", "!=", "none")
				.fields("id,displayName,alertStatus")
				.orderBy("displayName")
				.limit(200)
				.getItems();

			// Replace the loading text with a list built here, with one item per device showing its name and alert status...
			var list = document.createElement("ul");
			container.textContent = "";
			container.appendChild(list);
			devices.forEach(function (d) {
				var li = document.createElement("li");
				li.textContent = d.displayName + " (" + d.alertStatus + ")";
				list.appendChild(li);
			});

			// Fetch up to 100 alerts that have not cleared, requesting only the fields we need...
			var active = await lm.getAlerts({ filter: [["cleared", "=", false]], maxItems: 100, fields: "id,monitorObjectName,severity" });
			
			// Show a summary of the counts below the list...
			status.textContent = devices.length + " devices, " + active.length + " active alerts (latest 100).";
			lm.info("Rendered " + devices.length + " devices.");
		} catch (e) {
			// Show the error on the widget and also log it through the SDK...
			status.textContent = "Error: " + e.message;
			lm.error(e);
		}
	});
</script>
