

<!--
	LogicMonitor Header Widget
	Version 1.0.0
	Developed by Kevin Ford

	For the longest time I've wanted a "header" widget type to help separate vertical sections of a LogicMonitor dashboard. Using a Text widget with a different background color works but it's not a very clean looking solution. This widget just adds some simple Javascript to a Text widget to make it behave like a more like a seamless section header.

	What the script does:
	* Hides the widget's background so it blends seamlessly with the dashboard itself, and visually separates it from the important widgets.
	* Enlarges the widget's title so it can act as the section header (the text in the widget body can be used for extra detail).
	* Adds a bottom border to the widget so it's visually separated from the widgets below it.
	* Adds a hover effect to the widget so it's easy to tell when the widget is being hovered over.

	Prerequisites:
	* The 'Allow Scripts in Dashboard Text Widgets' setting must be enabled in your portal's Settings > Security section.

	TO USE:
	1. Create a new Text widget to the dashboard. I highly recommend making it the full width of the dashboard and the smallest height necessary.
	2. On the Text widget's edit dialog, click the "Source" button and paste in the contents of this script, then save the widget.
	3. At this point you can edit the text of the widget using LogicMonitor usual Text widget editing tools. LogicMonitor's HTML editor should leave the script intact, but you might have to re-paste the script if the editor accidentally removes it.
-->

<script>
	// Configuration...
	var CONFIG = {
		minWidgetHeight: "50px",     // Widget height when there is no content.
		widgetPadding: 40,           // Extra height (px) to allow for the header.
		titleHeight: "35px",		 // Height of the title text (this is also the height of the widget).
		titleFontSize: "xx-large",   // Font size of the title text.
		borderColor: "black",        // Color of the border below the widget.
		hoverBorderColor: "#ddd"	 // Color of the border when the widget is hovered over.
	};

	// LogicMonitor's generated markup. If a LogicMonitor update breaks this widget, these are the first things to check...
	var SELECTORS = {
		widget: 'div[id][class*="DashboardWidgetsGrid__StyledWidget"]',
		title: 'p.MuiTypography-root'
	};

	var thisWidget = getContainingWidgetId();
	var initialIframeHeight = null;
	var resizeObserver = null;
	var syncScheduled = false;

	// Function to return the ID of the LogicMonitor widget containing this iframe...
	function getContainingWidgetId() {
		try {
			const parentDoc = window.parent.document;
			const iframe = Array.from(parentDoc.querySelectorAll("iframe"))
				.find(frame => frame.contentWindow === window);
			return (iframe && iframe.closest("[id]")) || null;
		} catch (e) {
			return null;
		}
	}

	// Returns the DOM object containing the title of the widget...
	function getContainingWidgetTitle() {
		try {
			const widget = thisWidget.closest(SELECTORS.widget) || thisWidget;
			return widget.querySelector(SELECTORS.title);
		} catch (e) {
			return null;
		}
	}

	// Set a max height on the widget so it doesn't grow beyond the header bar...
	function initializeWidget() {
		if (!thisWidget) {
			console.warn("Containing widget not found; aborting initialization.");
			return;
		}

		// If max-height is already set on the widget, it was initialized by an earlier load of this iframe (e.g. after an edit).
		// The widget keeps its styles, but this is a new document, so it still needs its own observer.
		if (thisWidget.style.maxHeight) {
			console.debug("Widget already initialized (max-height is " + thisWidget.style.maxHeight + ")");
			syncWidgetHeight();
			observeContentSize();
			return;
		}

		// Capture the iframe's initial height before doing anything else.
		const iframe = window.frameElement;
		initialIframeHeight = iframe ? iframe.getBoundingClientRect().height : window.innerHeight;
		console.debug("Initial iframe height: " + initialIframeHeight + "px");

		// Set the max height of the widget to the initial height of the iframe...
		thisWidget.style.maxHeight = initialIframeHeight + "px";
		console.debug("Setting initial widget max height to " + initialIframeHeight + "px");

		// Add a placeholder class to the widget so we can apply header-specific styles to it...
		thisWidget.classList.add("dashboardHeaderWidget");
		addHeaderHoverStyle();

		resetWidget();
		observeContentSize();
	}

	// The widget lives in the parent page, so the hover rule has to be injected into the parent document (once)...
	function addHeaderHoverStyle() {
		try {
			const parentDoc = window.parent.document;
			if (parentDoc.getElementById("dashboardHeaderWidgetStyle")) return;
			const style = parentDoc.createElement("style");
			style.id = "dashboardHeaderWidgetStyle";
			// !important is needed because resetWidget() sets border: none as an inline style.
			const border = "1px solid " + CONFIG.hoverBorderColor + " !important;";
			style.textContent = ".dashboardHeaderWidget:hover { border-top: " + border + " border-left: " + border + " border-right: " + border + " }";
			parentDoc.head.appendChild(style);
		} catch (e) {
			console.warn("Unable to add header hover style:", e);
		}
	}

	// Apply our own styles to the widget...
	function resetWidget() {
		thisWidget.style.backgroundColor = "unset";
		thisWidget.style.border = "none";
		thisWidget.style.borderRadius = "0";
		thisWidget.style.height = CONFIG.minWidgetHeight;
		thisWidget.style.borderBottom = "1px solid " + CONFIG.borderColor;

		// Style the widget title. (Previously: replaced the title text with a non-breaking space. Something must remain there for the widget to still be movable.)
		// getContainingWidgetTitle().innerHTML = "&nbsp;";
		const widgetTitle = getContainingWidgetTitle();
		if (widgetTitle) {
			widgetTitle.style.fontSize = CONFIG.titleFontSize;
			widgetTitle.style.height = CONFIG.titleHeight;
			widgetTitle.parentElement.style.height = CONFIG.titleHeight;
			widgetTitle.parentElement.style.alignItems = "flex-end";
		} else {
			console.warn("Widget title element not found; skipping title styling.");
		}

		// Restyle the parent element of the widget...
		var thisWidgetParent = thisWidget.parentElement;
		thisWidgetParent.style.border = "none";
		thisWidgetParent.style.display = "flex";
		thisWidgetParent.style.alignItems = "center";
		thisWidgetParent.style.backgroundColor = "unset";

		syncWidgetHeight();
	}

	// Watch the content for size changes. Only one observer is ever created per iframe document...
	function observeContentSize() {
		if (resizeObserver) return;
		resizeObserver = new ResizeObserver(scheduleSync);
		resizeObserver.observe(document.documentElement);
	}

	// Coalesce bursts of resize notifications into a single sync per frame...
	function scheduleSync() {
		if (syncScheduled) return;
		syncScheduled = true;
		requestAnimationFrame(() => {
			syncScheduled = false;
			syncWidgetHeight();
		});
	}

	// Run once the iframe is fully loaded (or immediately if it already is).
	if (document.readyState === 'complete') {
		initializeWidget();
	} else {
		window.addEventListener('load', initializeWidget, { once: true });
	}

	// Only write a style when it actually changes, so we don't trigger needless layout/resize cycles...
	function setStyleIfChanged(element, property, value) {
		if (element.style[property] !== value) element.style[property] = value;
	}

	// Sync the height of the widget to the height of the content...
	function syncWidgetHeight() {
		// Treat the widget as empty only if there's no text and no visual content...
		const hasText = document.body.innerText.trim() !== "";
		const hasMedia = document.body.querySelector("img, video, iframe, canvas, svg, table, hr") !== null;

		// Make the header's content align to the bottom of the widget...
		thisWidget.parentElement.style.alignItems = "flex-end";

		if (!hasText && !hasMedia) {
			console.debug("Frame content is empty, setting height to 0");
			setStyleIfChanged(thisWidget, "height", CONFIG.minWidgetHeight);
			setStyleIfChanged(window.frameElement, "height", "0px");
		} else {
			// <html> is auto-height, so offsetHeight is the real content height regardless of the iframe's current size
			// (scrollHeight would never be smaller than the iframe's viewport, so it couldn't shrink).
			const frameHeight = document.documentElement.offsetHeight;
			setStyleIfChanged(window.frameElement, "height", frameHeight + "px");
			console.debug("Frame has content, setting height to " + frameHeight + "px");

			const contentHeight = frameHeight + CONFIG.widgetPadding;
			setStyleIfChanged(thisWidget, "height", contentHeight + "px");
			console.debug("Setting widget height to " + contentHeight + "px");

			// const contentElement = window.frameElement.contentDocument.querySelector(".fr-view");
			// const contentHeight = contentElement.scrollHeight + widgetPadding;
		}
	}
</script>
