<!--
	LogicMonitor Header Widget (SDK version)
	Version 2.0.0
	Developed by Kevin Ford

	A "header" widget type to help separate vertical sections of a LogicMonitor dashboard. This version is built on the LogicMonitor Widget SDK (lm) and doubles as an example of the SDK's styling and size-watching functions in lm.context.

	What the script does:
	* Hides the widget's background so it blends seamlessly with the dashboard itself.
	* Enlarges the widget's title so it can act as the section header (the text in the widget body can be used for extra detail).
	* Adds a bottom border to the widget so it's visually separated from the widgets below it.
	* Adds a hover effect to the widget so it's easy to tell when the widget is being hovered over.
	* Watches for size changes and resizes the widget to fit its content.

	SDK functions demonstrated:
	* lm.context.onReady          - wait for the widget to finish rendering.
	* lm.context.widgetContainer / widgetTitle / widgetParent / widgetFrame - locate the widget's elements in the dashboard.
	* lm.context.setStyleIfChanged - change inline styles without triggering needless layout cycles.
	* lm.context.injectParentStyle - add CSS to the dashboard page (the widget card lives outside this iframe).
	* lm.context.injectStyle      - add CSS to this widget's own content.
	* lm.context.observeSize      - react to size changes (throttled to once per animation frame).
	* lm.context.fitFrameToContent / resizeFrame - size the iframe to match its content (growing and shrinking).

	Prerequisites:
	* The 'Allow Scripts in Dashboard Text Widgets' setting must be enabled in your portal's Settings > Security section.

	TO USE:
	1. Add a new Text widget to the dashboard. I highly recommend making it the full width of the dashboard and the smallest height necessary.
	2. On the Text widget's edit dialog, click the "Source" button and paste in the contents of this file, then save the widget.
	3. You can then edit the text of the widget using LogicMonitor's usual Text widget editing tools. LogicMonitor's HTML editor should leave the scripts intact, but you might have to re-paste them if the editor accidentally removes them.
-->

<script src="https://cdn.jsdelivr.net/gh/logicmonitor/custom_widgets@main/sdk/lm-sdk.js"></script>
<script>
	// Configuration...
	var CONFIG = {
		minWidgetHeight: "50px",     // Widget height when there is no content.
		widgetPadding: 40,           // Extra height (px) to allow for the header.
		titleHeight: "35px",         // Height of the title text (this is also the height of the widget).
		titleFontSize: "xx-large",   // Font size of the title text.
		borderColor: "black",        // Color of the border below the widget.
		hoverBorderColor: "#ddd"     // Color of the border when the widget is hovered over.
	};

	// If a LogicMonitor update breaks widget or title lookups, override the SDK's selectors here, e.g.:
	// lm.context.selectors.title = "h2.newTitleClass";

	var ctx = lm.context;
	var stopObserving = null;

	lm.context.onReady(function () {
		lm.configure({ widgetName: "Dashboard Header" });
		initializeWidget();
	});

	function initializeWidget() {
		var card = ctx.widgetContainer();
		if (!card || !ctx.isEmbedded()) {
			lm.warn("Containing widget not found; aborting initialization.");
			return;
		}

		// If max-height is already set, an earlier load of this iframe (e.g. after an edit) initialized the card.
		// The card keeps its styles, but this is a new document, so it still needs its own observer.
		if (card.style.maxHeight) {
			lm.debug("Widget already initialized (max-height is " + card.style.maxHeight + ")");
		} else {
			// Cap the card at the iframe's initial height so it can't grow beyond the header bar...
			var frame = ctx.widgetFrame();
			var initialHeight = frame ? frame.getBoundingClientRect().height : window.innerHeight;
			lm.debug("Initial iframe height: " + initialHeight + "px");
			card.style.maxHeight = initialHeight + "px";

			// Style the dashboard page: the card lives outside this iframe, so its hover rule goes in the parent document.
			// !important is needed because styleCard() sets the border as an inline style.
			var border = "1px solid " + CONFIG.hoverBorderColor + " !important;";
			ctx.injectParentStyle("dashboardHeaderWidgetStyle",
				".dashboardHeaderWidget:hover { border-top: " + border + " border-left: " + border + " border-right: " + border + " }");
			card.classList.add("dashboardHeaderWidget");

			styleWidget();
		}

		// Style this widget's own content (inside the iframe)...
		ctx.injectStyle("dashboardHeaderContentStyle", "body { margin: 0; }");

		syncWidgetHeight();

		// Watch for size changes in the content and in the card (e.g. dashboard width changes)...
		if (stopObserving) stopObserving();
		var stopContent = ctx.observeSize(syncWidgetHeight);
		var stopCard = ctx.observeSize(syncWidgetHeight, card);
		stopObserving = function () { stopContent(); stopCard(); stopObserving = null; };
		window.addEventListener("pagehide", function () { if (stopObserving) stopObserving(); }, { once: true });
	}

	// Apply our own styles to the widget card, title and grid cell...
	function styleWidget() {
		var set = ctx.setStyleIfChanged;

		var card = ctx.widgetContainer();
		set(card, "backgroundColor", "unset");
		set(card, "border", "none");
		set(card, "borderRadius", "0");
		set(card, "height", CONFIG.minWidgetHeight);
		set(card, "borderBottom", "1px solid " + CONFIG.borderColor);

		// Something must remain in the title for the widget to still be movable, so it is styled rather than removed.
		var title = ctx.widgetTitle();
		if (title) {
			set(title, "fontSize", CONFIG.titleFontSize);
			set(title, "height", CONFIG.titleHeight);
			set(title.parentElement, "height", CONFIG.titleHeight);
			set(title.parentElement, "alignItems", "flex-end");
		} else {
			lm.warn("Widget title element not found; skipping title styling.");
		}

		var cell = ctx.widgetParent();
		if (cell) {
			set(cell, "border", "none");
			set(cell, "display", "flex");
			set(cell, "alignItems", "flex-end"); // Align the header's content to the bottom of the widget.
			set(cell, "backgroundColor", "unset");
		}
	}

	// Sync the height of the card and iframe to the height of the content...
	function syncWidgetHeight() {
		var card = ctx.widgetContainer();
		if (!card) return;

		// Treat the widget as empty only if there's no text and no visual content...
		var hasText = document.body.innerText.trim() !== "";
		var hasMedia = document.body.querySelector("img, video, iframe, canvas, svg, table, hr") !== null;

		if (!hasText && !hasMedia) {
			lm.debug("Frame content is empty, collapsing frame");
			ctx.setStyleIfChanged(card, "height", CONFIG.minWidgetHeight);
			ctx.resizeFrame(0);
		} else {
			// Size the iframe to its content (growing or shrinking) and get the content height back...
			var frameHeight = ctx.fitFrameToContent();
			ctx.setStyleIfChanged(card, "height", (frameHeight + CONFIG.widgetPadding) + "px");
			lm.debug("Frame height " + frameHeight + "px, widget height " + (frameHeight + CONFIG.widgetPadding) + "px");
		}
	}
</script>
